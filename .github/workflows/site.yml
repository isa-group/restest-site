# Builds the site and publishes it on GitHub Pages.
#
# The documentation is RESTest's at the version in restest-version. A workflow of RESTest's is to write
# it there when a release is published; that commit, like any other on main, rebuilds and publishes the
# site. Every week the site is also built from RESTest's master, without publishing it, to say that it
# still builds from what the next version will be: a page that lost its title, a link to nothing or an
# index of another shape fails that build, naming the file.

name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build it, with the documentation of the version in restest-version
        run: npm run build

      # Uploaded on pull requests too, so that a change can be looked at before it is published.
      - name: Keep the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Publish it on GitHub Pages
    needs: build
    # Only main is published, whichever branch a run by hand was started on.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One publication at a time, and none cut short by the next.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  check-master:
    name: Build the site from RESTest's master
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Build it, with the documentation on master
        run: npm run sync -- --ref master && npx astro build
